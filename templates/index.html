<!DOCTYPE html>
<html>
<head>
<title>ML Prediction App</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
text-align:center;
padding:50px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:400px;
margin:auto;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

input{
width:90%;
padding:10px;
margin:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:10px 20px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.result{
margin-top:20px;
font-size:20px;
color:green;
}

</style>
</head>

<body>

<div class="container">

<h2>Machine Learning Prediction</h2>

<form action="/predict" method="post">

<input type="text" name="feature1" placeholder="Feature 1" required>

<input type="text" name="feature2" placeholder="Feature 2" required>

<input type="text" name="feature3" placeholder="Feature 3" required>

<input type="text" name="feature4" placeholder="Feature 4" required>

<button type="submit">Predict</button>

</form>

<div class="result">
{{ prediction_text }}
</div>

</div>

</body>
</html>
